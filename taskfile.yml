version: '3'

vars:
  BINARY_NAME: gopherwm

tasks:
  default:
    deps: [build]
    cmds:
      - echo "Running app.."
      - ./start.sh
  fmt:
    desc: code formatting
    cmds:
      - echo "Code formatting"
      - go fmt ./...

  build:
    desc: "Compiling"
    deps: [fmt]
    sources:
      - './**/*.go'
      - 'go.mod'
    generates:
      - bin/{{.BINARY_NAME}}
    cmds:
      - go build -v -o bin/{{.BINARY_NAME}} .

  test:
    desc: "Run tests"
    cmds:
      - go test -v ./...

  vet:
    desc: "Run static analysis"
    cmds:
      - go vet ./...

  test-race:
    desc: "Run tests with the race detector"
    cmds:
      - go test -race -v ./...

  clean:
    desc: "Remove compiled files"
    cmds:
      - rm -rf bin/
