version: '3'

vars:
  BINARY_NAME: gopherwm

tasks:
  default:
    deps: [build]
    cmds:
      - echo "Running app.."
      - ./start.sh
  fmt:
    desc: code formatting
    cmds:
      - echo "Code formatting"
      - go fmt ./...

  build:
    desc: "Compiling"
    deps: [fmt]
    sources:
      - './**/*.go'
      - 'go.mod'
    generates:
      - bin/{{.BINARY_NAME}}
    cmds:
      - go build -v -o bin/{{.BINARY_NAME}} .

  test:
    desc: "Run tests"
    cmds:
      - go test -v ./...

  clean:
    desc: "Remove compiled files"
    cmds:
      - rm -rf bin/
